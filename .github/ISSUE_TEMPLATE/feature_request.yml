name: 💡 功能建议
description: 提出新功能或改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        一句话需求很难排期 —— 请描述场景与收益。可对照 docs/ROADMAP.md 看是否已在计划内。
  - type: textarea
    id: problem
    attributes:
      label: 场景与问题
      description: 你在剪什么片子时遇到了什么不爽？有参考片效果截图更好
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的做法
      description: 你希望它变成什么样（交互 / 输入输出）
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 没有这个功能时你如何 workaround？为什么不够好
  - type: dropdown
    id: area
    attributes:
      label: 涉及的层
      options:
        - 分析引擎 (src/lib/cpv)
        - 排片/初剪
        - 音乐轨道/混音
        - 导出/渲染
        - UI/交互
        - AI 导演层
        - 部署/集成
        - 其他
  - type: checkboxes
    id: contribute
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交 PR 实现它（先认领再动工）
